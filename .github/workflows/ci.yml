name: CI

# Runs the same gate the deploy uses (build -> validate -> pytest) on every PR
# and on pushes to non-main branches, so broken links / malformed ids / failing
# tests are caught *before* merge — not only after a push to main (which is the
# only thing that triggers deploy-site.yml). See prevention/ci-cd-hardening.md.

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs (not mutable tags) — see prevention/ci-cd-hardening.md.
      # Keep current with Dependabot (github-actions ecosystem).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: site/requirements.txt

      - name: Install dependencies
        run: pip install -r site/requirements.txt

      - name: Build site
        run: python site/build.py

      - name: Validate build
        run: python site/validate.py

      - name: Run test suite
        run: python -m pytest tests/ -v
